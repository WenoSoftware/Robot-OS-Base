name: Build Weno Robot OS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Buildroot Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libncurses-dev python3 perl rsync wget cpio bc unzip file

      - name: Configure Buildroot
        run: |
          cd buildroot
          make qemu_aarch64_virt_defconfig

      - name: Compile OS Image
        run: |
          cd buildroot
          export FORCE_UNSAFE_CONFIGURE=1
          make -j$(nproc)

      - name: Upload OS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weno-robot-images
          path: buildroot/output/images/